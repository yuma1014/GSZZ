<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>格式轉轉 Format Spin</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

<style>
/* ===== UI 完全保留（未改動） ===== */
:root{
--bg:#F2F2F7;--card:rgba(255,255,255,.85);--pri:#4c419e;
--txt:#1C1C1E;--sub:#8E8E93;--r:22px;--rm:14px;
--shadow:0 4px 20px rgba(0,0,0,.06)
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{padding:16px 24px;display:flex;justify-content:space-between;align-items:center;background:rgba(242,242,247,.8);backdrop-filter:blur(10px)}
.menu-btn{width:40px;height:40px;border-radius:50%;border:none;background:#fff}
main{flex:1;overflow-y:auto;padding:20px 24px 120px}
.card{background:var(--card);border-radius:var(--r);padding:24px;margin-bottom:20px;box-shadow:var(--shadow);cursor:pointer}
.card h2{margin:0 0 6px}
.workspace{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:.4s;z-index:20;padding:24px}
.workspace.active{transform:translateY(0)}
.drop-zone{border:2px dashed #C6C6C8;border-radius:var(--r);height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;background:#fff}
select,button{width:100%;padding:16px;border-radius:var(--rm);border:none;margin-bottom:16px;font-size:16px}
button{background:var(--pri);color:#fff;font-weight:600}
.progress-container{display:none}
.progress-bar{height:6px;background:#E5E5EA;border-radius:3px}
.progress-fill{height:100%;width:0;background:var(--pri)}
</style>
</head>

<body>

<header>
<div>格式轉轉</div>
<button class="menu-btn">☰</button>
</header>

<main>
<div class="card" onclick="openWorkspace('image')"><h2>圖片格式轉換</h2></div>
<div class="card" onclick="openWorkspace('video')"><h2>影片格式轉換</h2></div>
<div class="card" onclick="openWorkspace('gif')"><h2>影片 / GIF 互轉</h2></div>
</main>

<div id="workspace" class="workspace">
<h2 id="ws-title">工具</h2>

<div class="drop-zone" onclick="fileInput.click()">點擊選擇檔案
<input type="file" id="fileInput" hidden>
</div>

<div id="file-info">尚未選擇檔案</div>
<select id="format-select"></select>
<button id="convert-btn" onclick="startConversion()">開始轉換</button>

<div class="progress-container" id="progress-container">
<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
<div id="time-left">準備中...</div>
</div>
</div>

<script>
/* ========= SAB 偵測 ========= */
function supportsSharedArrayBuffer(){
    return typeof SharedArrayBuffer !== 'undefined';
}

let currentMode='',selectedFile=null,ffmpeg=null;
const { createFFmpeg, fetchFile } = FFmpeg;

/* ========= FFmpeg 初始化（自動降級） ========= */
async function initFFmpeg(){
    if(ffmpeg) return;

    const singleThread = !supportsSharedArrayBuffer();

    ffmpeg = createFFmpeg({
        log:true,
        corePath:'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
        worker: !singleThread
    });

    ffmpeg.setProgress(({ratio})=>{
        document.getElementById('progress-fill').style.width = (ratio*100)+'%';
    });

    await ffmpeg.load();
}

/* ========= UI ========= */
const fileInput=document.getElementById('fileInput');
fileInput.onchange=e=>{
    selectedFile=e.target.files[0];
    document.getElementById('file-info').innerText=selectedFile.name;
};

function openWorkspace(m){
    currentMode=m;
    document.getElementById('workspace').classList.add('active');
    const sel=document.getElementById('format-select');
    sel.innerHTML='';
    const map={
        image:['jpg','png','webp','bmp'],
        video:['mp4','webm'],
        gif:['gif','mp4']
    };
    map[m].forEach(f=>{
        let o=document.createElement('option');
        o.value=f;o.text=f.toUpperCase();sel.appendChild(o);
    });
}

/* ========= 轉換 ========= */
async function startConversion(){
    if(!selectedFile) return alert('請選檔案');

    document.getElementById('progress-container').style.display='block';
    document.getElementById('time-left').innerText =
        supportsSharedArrayBuffer() ? '轉換中...' : '行動裝置降級模式（較慢）';

    await initFFmpeg();

    const ext=selectedFile.name.split('.').pop();
    const out=document.getElementById('format-select').value;

    ffmpeg.FS('writeFile','in.'+ext,await fetchFile(selectedFile));

    let args=['-i','in.'+ext,'out.'+out];
    if(out==='gif') args=['-i','in.'+ext,'-vf','fps=8,scale=320:-1','out.gif'];

    try{
        await ffmpeg.run(...args);
    }catch(e){
        alert('轉換失敗（裝置效能不足）');
        return;
    }

    const data=ffmpeg.FS('readFile','out.'+out);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data.buffer]));
    a.download='converted.'+out;
    a.click();
}
</script>

</body>
</html>
